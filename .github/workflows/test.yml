name: Test
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --project skills/youtube-shadowing --locked --group dev --python 3.13
      - run: uv run --project skills/youtube-shadowing --group dev ruff check skills/youtube-shadowing/scripts tools tests
      - run: uv run --project skills/youtube-shadowing --group dev pytest
      - run: uv run --project skills/youtube-shadowing python tools/build_packages.py
