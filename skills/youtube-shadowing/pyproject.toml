[project]
name = "youtube-shadowing-skill"
version = "0.1.0"
description = "Faithful, sentence-by-sentence YouTube shadowing handouts for AI assistants"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2026.9.23",
    "reportlab>=4.4,<5",
    "pypdf>=6,<7",
    "platformdirs>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14", "pymupdf>=1.26", "fonttools>=4.60", "pyyaml>=6,<7"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
